<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBER-ID VERIFIER - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* --- THEME VARIABLES --- */
        :root {
            /* DEFAULT DARK THEME (Cyberpunk) */
            --bg-body: #020617;
            --bg-panel: rgba(15, 23, 42, 0.7);
            --bg-input: rgba(0, 243, 255, 0.05);
            
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            
            --primary: #00f3ff;       /* Cyan */
            --secondary: #ff00e6;     /* Pink */
            --success: #39ff14;       /* Neon Green */
            --error: #ff3838;         /* Neon Red */
            
            --border-color: rgba(0, 243, 255, 0.2);
            --glow-color: rgba(0, 243, 255, 0.15);
            --grid-line: rgba(0, 243, 255, 0.05);
        }

        /* LIGHT THEME OVERRIDES (High-Tech Lab) */
        [data-theme="light"] {
            --bg-body: #f1f5f9;
            --bg-panel: rgba(255, 255, 255, 0.75);
            --bg-input: rgba(0, 100, 255, 0.03);
            
            --text-main: #1e293b;
            --text-muted: #64748b;
            
            --primary: #2563eb;       /* Deep Royal Blue */
            --secondary: #d946ef;     /* Magenta */
            --success: #059669;       /* Emerald */
            --error: #dc2626;         /* Red */
            
            --border-color: rgba(37, 99, 235, 0.2);
            --glow-color: rgba(37, 99, 235, 0.1);
            --grid-line: rgba(0, 0, 0, 0.03);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; transition: background-color 0.4s ease, color 0.3s ease, border-color 0.3s ease; }
        
        body {
            background-color: var(--bg-body);
            background-image: 
                linear-gradient(var(--grid-line) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
            background-size: 30px 30px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Inter', sans-serif;
            padding: 20px;
        }

        /* Theme Toggle Button */
        .theme-toggle-wrapper {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 100;
        }
        
        .theme-btn {
            background: var(--bg-panel);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px;
            border-radius: 50%;
            cursor: pointer;
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            backdrop-filter: blur(5px);
        }
        .theme-btn:hover {
            box-shadow: 0 0 15px var(--glow-color);
            color: var(--primary);
            border-color: var(--primary);
        }

        .login-container {
            width: min(100%, 440px);
            background: linear-gradient(180deg, rgba(15, 23, 42, 0.96) 0%, rgba(2, 6, 23, 0.96) 100%);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid var(--border-color);
            border-radius: 22px;
            box-shadow: 0 24px 70px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(0, 243, 255, 0.05) inset;
            overflow: hidden;
            position: relative;
        }

        .login-container::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at top, rgba(0, 243, 255, 0.10), transparent 55%);
            pointer-events: none;
        }

        .login-header {
            position: relative;
            padding: 38px 34px 26px;
            text-align: center;
            border-bottom: 1px solid rgba(0, 243, 255, 0.14);
            background: linear-gradient(180deg, rgba(0, 243, 255, 0.08) 0%, rgba(0, 0, 0, 0) 100%);
        }

        .login-header .header-icon {
            width: 84px;
            height: 84px;
            margin: 0 auto 18px;
            border-radius: 24px;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, rgba(0, 243, 255, 0.18), rgba(255, 0, 230, 0.16));
            border: 1px solid rgba(0, 243, 255, 0.2);
            box-shadow: 0 0 40px rgba(0, 243, 255, 0.14);
        }

        .login-header .header-icon i {
            font-size: 2.4rem;
            background: linear-gradient(var(--primary), var(--secondary));
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
            margin: 0;
        }

        .login-header h1 {
            font-family: 'Chakra Petch', sans-serif;
            font-weight: 700;
            font-size: 2rem;
            color: var(--text-main);
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .login-header p {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .login-form {
            position: relative;
            padding: 28px 34px 18px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            color: var(--text-main);
            font-family: 'Chakra Petch', sans-serif;
            font-size: 0.9rem;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .input-with-icon {
            position: relative;
        }

        .input-with-icon i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--primary);
            font-size: 1.2rem;
        }

        .form-input {
            width: 100%;
            padding: 15px 15px 15px 50px;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 15px var(--glow-color);
        }

        .form-input::placeholder {
            color: var(--text-muted);
        }

        .password-toggle-btn {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--primary);
            cursor: pointer;
            font-size: 1.2rem;
            transition: all 0.3s;
            padding: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .password-toggle-btn:hover {
            color: var(--secondary);
            transform: translateY(-50%) scale(1.1);
        }

        .input-with-icon.password-wrapper {
            position: relative;
        }

        .input-with-icon.password-wrapper .form-input {
            padding-right: 50px;
        }

        .login-btn {
            width: 100%;
            max-width: 100%;
            padding: 16px;
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            border: none;
            border-radius: 8px;
            color: white;
            font-family: 'Chakra Petch', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .login-btn i {
            font-size: 1rem;
        }

        .login-btn:hover {
            box-shadow: 0 0 30px var(--glow-color);
            transform: translateY(-2px);
        }

        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        .error-message {
            color: var(--error);
            font-size: 0.9rem;
            margin-top: 5px;
            display: none;
            align-items: center;
            gap: 8px;
        }

        .error-message.show {
            display: flex;
        }

        .login-footer {
            position: relative;
            text-align: center;
            padding: 18px 24px 24px;
            color: var(--text-muted);
            font-size: 0.9rem;
            border-top: 1px solid rgba(0, 243, 255, 0.12);
        }

        /* Animation for login */
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .pulse {
            animation: pulse 2s infinite;
        }

        /* Loading animation */
        .loading-dots {
            display: inline-block;
        }

        .loading-dots::after {
            content: '...';
            animation: dots 1.5s steps(4, end) infinite;
        }

        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }

        @media (max-width: 480px) {
            .login-form {
                padding: 24px 20px 16px;
            }
            
            .login-header {
                padding: 28px 20px 20px;
            }
            
            .login-header h1 {
                font-size: 1.6rem;
            }
            
            .theme-toggle-wrapper {
                top: 15px;
                right: 15px;
            }

            .login-container {
                border-radius: 18px;
            }
        }
    </style>
</head>
<body>
    <!-- Theme Toggle Button -->
    <div class="theme-toggle-wrapper">
        <button class="theme-btn" id="theme-toggle" title="Toggle Light/Dark Mode">
            <i class="fas fa-sun" id="theme-icon"></i>
        </button>
    </div>

    <div class="login-container">
        <div class="login-header">
            <div class="header-icon">
                <i class="fas fa-fingerprint"></i>
            </div>
            <h1>Login</h1>
            <p>Access Your Account</p>
        </div>

        <form id="loginForm" class="login-form">
            <div class="form-group">
                <label for="username">Username</label>
                <div class="input-with-icon">
                    <i class="fas fa-user-circle"></i>
                    <input type="text" 
                           id="username" 
                           class="form-input" 
                           placeholder="Enter your username"
                           required
                           autocomplete="username">
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-with-icon password-wrapper">
                    <i class="fas fa-lock"></i>
                    <input type="password" 
                           id="password" 
                           class="form-input" 
                           placeholder="Enter your password"
                           required
                           autocomplete="current-password">
                    <button type="button" class="password-toggle-btn" id="passwordToggle" title="Show/Hide Password">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
                <div id="passwordError" class="error-message" style="margin-top:10px;">
                    <i class="fas fa-exclamation-circle"></i>
                    <span>Invalid credentials. Access denied.</span>
                </div>
            </div>

            <button type="submit" class="login-btn" id="loginBtn">
                <i class="fas fa-sign-in-alt"></i>
                <span>Login</span>
            </button>

            <div id="loginStatus" class="error-message" style="color: var(--text-muted); margin-top: 15px; justify-content:center;">
                <i class="fas fa-info-circle"></i>
                <span>Press Enter to login</span>
            </div>
        </form>

        <div class="login-footer">
            <p>© 2025 Loan Management System. All rights reserved.</p>
            <p style="margin-top: 10px;">Don't have an account? <a href="/register" style="color: var(--primary); text-decoration: none; font-weight: 600;">Register here</a></p>
        </div>
    </div>

    <script>
        // --- THEME TOGGLE LOGIC ---
        const themeToggle = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');
        const htmlElement = document.documentElement;

        // Check local storage on load
        const savedTheme = localStorage.getItem('theme') || 'dark';
        setTheme(savedTheme);

        themeToggle.addEventListener('click', () => {
            const currentTheme = htmlElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            setTheme(newTheme);
        });

        function setTheme(theme) {
            htmlElement.setAttribute('data-theme', theme);
            localStorage.setItem('theme', theme);
            
            // Update icon
            if (theme === 'dark') {
                themeIcon.className = 'fas fa-sun'; // Show sun icon in dark mode (to switch to light)
            } else {
                themeIcon.className = 'fas fa-moon'; // Show moon icon in light mode (to switch to dark)
            }
        }

        // --- PASSWORD TOGGLE LOGIC ---
        const passwordToggle = document.getElementById('passwordToggle');
        const passwordInput = document.getElementById('password');
        const passwordIcon = passwordToggle.querySelector('i');

        passwordToggle.addEventListener('click', function(e) {
            e.preventDefault();
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                passwordIcon.className = 'fas fa-eye-slash';
            } else {
                passwordInput.type = 'password';
                passwordIcon.className = 'fas fa-eye';
            }
        });

        // --- LOGIN FORM HANDLING ---
        const loginForm = document.getElementById('loginForm');
        
        loginForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            
            // Hide previous errors
            document.getElementById('passwordError').classList.remove('show');
            document.getElementById('loginStatus').classList.remove('show');
            
            // Basic validation
            if (!username || !password) {
                document.getElementById('passwordError').querySelector('span').textContent = 'Please enter both username and password';
                document.getElementById('passwordError').classList.add('show');
                return;
            }
            
            // Show loading state
            const loginBtn = document.getElementById('loginBtn');
            loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Logging in<span class="loading-dots"></span>';
            loginBtn.disabled = true;
            
            try {
                // Send login request to server
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username: username,
                        password: password
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    // Successful login
                    loginBtn.innerHTML = '<i class="fas fa-check"></i> Success!';
                    loginBtn.style.background = 'linear-gradient(45deg, var(--success), #0da271)';
                    
                    // Save theme preference for main app
                    const currentTheme = htmlElement.getAttribute('data-theme');
                    
                    // Redirect to main application
                    setTimeout(() => {
                        window.location.href = data.redirect || '/';
                    }, 800);
                } else {
                    // Failed login
                    document.getElementById('passwordError').querySelector('span').textContent = data.message || 'Invalid credentials. Access denied.';
                    document.getElementById('passwordError').classList.add('show');
                    loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Login';
                    loginBtn.disabled = false;
                    
                    // Add shake animation to form
                    loginForm.style.animation = 'shake 0.5s';
                    setTimeout(() => {
                        loginForm.style.animation = '';
                    }, 500);
                    
                    // Clear password field
                    document.getElementById('password').value = '';
                    document.getElementById('password').focus();
                }
            } catch (error) {
                // Network error
                document.getElementById('passwordError').querySelector('span').textContent = 'Network error. Please try again.';
                document.getElementById('passwordError').classList.add('show');
                loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Login';
                loginBtn.disabled = false;
            }
        });

        // Add shake animation
        const style = document.createElement('style');
        style.textContent = `
            @keyframes shake {
                0%, 100% { transform: translateX(0); }
                10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
                20%, 40%, 60%, 80% { transform: translateX(5px); }
            }
        `;
        document.head.appendChild(style);

        // Auto-focus username on load
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('username').focus();
            
            // Check if already logged in (optional)
            fetch('/check-auth')
                .then(response => {
                    if (response.ok) {
                        window.location.href = '/';
                    }
                })
                .catch(() => {
                    // Ignore errors, stay on login page
                });
        });

        // Show/hide password hint on focus
        document.getElementById('password').addEventListener('focus', () => {
            document.getElementById('loginStatus').classList.add('show');
        });

        document.getElementById('password').addEventListener('blur', () => {
            document.getElementById('loginStatus').classList.remove('show');
        });

        // Enter key navigation
        document.getElementById('username').addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !document.getElementById('password').value) {
                e.preventDefault();
                document.getElementById('password').focus();
            }
        });

        document.getElementById('password').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                loginForm.dispatchEvent(new Event('submit'));
            }
        });
    </script>
</body>
</html>
